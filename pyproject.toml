[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi05-a1z"
version = "0.1.0"
readme = "README.md"
license = {file = "LICENSE.txt"}
description = "A1Z single and dual-arm integration for official openpi pi0.5"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<2", "msgpack>=1,<2", "websockets>=14,<16", "pyyaml>=6", "typing-extensions>=4.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "a1z_runtime/client"]
testpaths = ["tests"]
